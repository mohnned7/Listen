<style>

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{position:relative;overflow:hidden;border:0;text-align:right;color:#fff;border-radius:20px;padding:14px 14px 12px;min-height:118px;font:inherit;cursor:pointer;

.foot{text-align:center;color:var(--mute);font-size:12px;margin:22px 0 0}

.tx{flex:1;min-width:0}
.tx .d{direction:ltr;text-align:right;font-size:18px;font-weight:800;overflow-wrap:anywhere;line-height:1.35}
.tx .a{display:none;color:var(--pr);font-size:16px;font-weight:700}

.note{margin:12px 0;padding:10px 14px;border-radius:14px;background:#FFF6DD;color:#6B4D00;font-size:13.5px;border:1.5px dashed #F2B33D}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);

}
function route(){ var id = (location.hash||'').replace('#',''); if(id){ openSec(id); } else { showHome(); } }
function pickVoice(){
  if(!synth) return;
  var v = synth.getVoices() || [];
  var de = v.filter(function(x){return /^de/i.test(x.lang)});
  var good = de.filter(function(x){return /natural|neural|enhanced|premium|google/i.test(x.name)});
  voice = good.find(function(x){return /de[-_]DE/i.test(x.lang)}) || good[0] || de.find(function(x){return /de[-_]DE/i.test(x.lang)}) || de[0] || null;
  var msg = (v.length && !voice && !Object.keys(AUD).length) ? 'مفيش صوت ألماني على جهازك. على أندرويد: الإعدادات > اللغة > تحويل النص إلى كلام > نزّل اللغة الألمانية، وبعدين افتح الصفحة تاني.' : '';
  ['warn','warn2'].forEach(function(id){ var w=document.getElementById(id); w.hidden=!msg; w.textContent=msg; });
}
function mark(el){ var o=document.querySelector('.item.on'); if(o) o.classList.remove('on'); if(el) el.classList.add('on'); }
function stopAll(){ token++; if(synth) synth.cancel(); if(curA){ try{curA.pause();}catch(_){ } curA=null; } mark(null); }
function tts(text, done){
  if(!synth){ if(done) done(); return; }
  synth.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = voice ? voice.lang : 'de-DE'; if(voice) u.voice = voice;
  u.rate = rate; u.pitch = 1;
  u.onend = function(){ if(done) done(); }; u.onerror = function(){ if(done) done(); };
  synth.speak(u);
}
function say(text, done){
  if(curA){ try{curA.pause();}catch(_){ } curA=null; }
  var b64 = AUD[text];
  if(!b64){ return tts(text, done); }
  if(synth) synth.cancel();
  var a = new Audio('data:audio/mpeg;base64,'+b64);
  a.playbackRate = rate < 0.8 ? 0.8 : 1; try{ a.preservesPitch = true; }catch(_){ }
  var fin=false; function end(){ if(fin) return; fin=true; if(done) done(); }
  a.onended = end; a.onerror = function(){ if(!fin){ fin=true; tts(text, done); } };
  curA = a; a.play().catch(function(){ if(!fin){ fin=true; tts(text, done); } });
}
function playOne(el){ token++; var it = cur.items[+el.dataset.i]; mark(el); say(it.say||it.de, function(){}); }
function playAll(){
  if(!cur) return; token++; var my = token, i = 0, els = document.querySelectorAll('#main .item');
  (function next(){
    if(my!==token || i>=els.length){ mark(null); return; }
    var el = els[i], it = cur.items[i]; i++; mark(el); el.scrollIntoView({block:'center',behavior:'smooth'});
    say(it.say||it.de, function(){ if(my===token) setTimeout(next, rate<0.8?1100:800); });
  })();
}
document.addEventListener('click', function(e){
  var t;
  if((t=e.target.closest('.sc'))||(t=e.target.closest('#nav2 button'))){ location.hash = t.dataset.id; return; }
  if(e.target.closest('#back')){ history.pushState('', document.title, location.pathname+location.search); route(); return; }
  if(e.target.closest('#prb')){ var on=document.body.classList.toggle('sp'); document.getElementById('prb').textContent = on?'النطق العربي: ظاهر':'النطق العربي: مخفي'; try{localStorage.setItem('sp',on?'1':'0');}catch(_){ } return; }
  if((t=e.target.closest('.item'))){ playOne(t); return; }
  if((t=e.target.closest('#seg button'))){ rate=parseFloat(t.dataset.r); Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(x){x.classList.toggle('on',x===t)}); return; }
  if(e.target.closest('#all')){ playAll(); return; }
  if(e.target.closest('#stop')){ stopAll(); return; }
});
window.addEventListener('hashchange', route);
buildHome();
try{ if(localStorage.getItem('sp')==='1'){ document.body.classList.add('sp'); document.getElementById('prb').textContent='النطق العربي: ظاهر'; } }catch(_){ }
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; setTimeout(pickVoice, 800); }
else if(!Object.keys(AUD).length){ ['warn','warn2'].forEach(function(id){ var w=document.getElementById(id); w.hidden=false; w.textContent='المتصفح ده مش بيدعم الصوت. جرّب Chrome أو Safari.'; }); }
route();
</script>
</body>
