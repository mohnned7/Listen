}
function playAll(sid){
  token++; var my = token; var s = DATA.filter(function(x){return x.id===sid})[0];
  var btns = Array.prototype.slice.call(document.querySelectorAll('.item[data-s="'+sid+'"]'));
  var i = 0;
  (function next(){
    if(my !== token || i >= btns.length){ mark(null); return; }
    var b = btns[i++]; mark(b); b.scrollIntoView({block:'center'});
    say(s.items[i-1].say || s.items[i-1].de, function(){ setTimeout(next, rate < 0.8 ? 1100 : 800); });
  })();
}
function whichSection(){
  var best = DATA[0].id, top = 1e9;
  DATA.forEach(function(s){
    var r = document.getElementById(s.id).getBoundingClientRect();
    var d = Math.abs(r.top - 70);
    if(r.bottom > 80 && d < top){ top = d; best = s.id; }
  });
  return best;
}
document.addEventListener('click', function(e){
  var lb = e.target.closest('.lb'); if(lb){ token++; mark(lb.closest('.item')); say(lb.dataset.ls, function(){}); return; }
  var b = e.target.closest('.item'); if(b){ playOne(b); return; }
  var sb = e.target.closest('#seg button');
  if(sb){ rate = parseFloat(sb.dataset.r); Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(x){x.classList.toggle('on',x===sb)}); return; }
  if(e.target.closest('#all')){ playAll(whichSection()); return; }
  if(e.target.closest('#stop')){ token++; if(synth) synth.cancel(); mark(null); return; }
});
build();
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; setTimeout(pickVoice, 800); }
else { var w=document.getElementById('warn'); w.hidden=false; w.textContent='المتصفح ده مش بيدعم الصوت. جرّب Chrome أو Safari.'; }
function goHash(){ var id = (location.hash||'').replace('#',''); var el = id && document.getElementById(id); if(el){ el.scrollIntoView(); } }
window.addEventListener('hashchange', goHash); setTimeout(goHash, 100);
</script>
