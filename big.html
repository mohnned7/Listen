<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اسمع الألماني - كتاب النطق</title>
<style>
:root{--bg:#fffaf1;--card:#ffffff;--ink:#2b2f45;--mute:#6b7190;--line:#ece4d4;--ar:#0f7b8a;--bar:#ffffffee}

:root[data-theme="dark"]{--bg:#171a26;--card:#222638;--ink:#eef0fa;--mute:#a4abc6;--line:#323852;--ar:#5fd3e0;--bar:#1e2234ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
header{padding:18px 16px 8px;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
.tabs{display:flex;gap:8px;justify-content:center;padding:6px 12px 10px}
.tabs button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;font-weight:700}
.tabs button.on{background:#3d8bff;border-color:#3d8bff;color:#fff}
[hidden]{display:none !important}
.ar{display:none}
body.sp .ar{display:block}
.lnm{display:none}
body.sp .lnm{display:inline}
.prb{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 12px;font:inherit;font-size:13px;font-weight:700}
body.sp .prb{background:#8a6cf0;border-color:#8a6cf0;color:#fff}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
 display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;text-decoration:none;color:#fff;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700}
.note{margin:12px 14px;padding:10px 14px;border-radius:14px;background:#fff3cf;color:#5b4a0a;font-size:13.5px;border:2px dashed #f0cf55}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .note{background:#3b3414;color:#f5e6a8}}
section{margin:18px 12px 0}
section h2{margin:0 0 8px;padding:10px 16px;border-radius:20px;color:#fff;font-size:18px;display:flex;justify-content:space-between;align-items:center}
section h2 small{font-weight:400;font-size:12px;opacity:.9;direction:ltr}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 12px;margin:0 0 8px;font:inherit;color:inherit;cursor:pointer}
.item.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.big{flex:0 0 auto;min-width:62px;text-align:center;background:var(--c);color:#fff;border-radius:16px;padding:6px 10px;font-size:22px;font-weight:800;direction:ltr}
.gh{margin:14px 4px 6px;font-weight:800;color:var(--c);font-size:17px;direction:ltr;text-align:left}
.lb{margin-top:6px;border:2px solid var(--c);background:transparent;color:var(--c);border-radius:999px;padding:3px 12px;font:inherit;font-size:12.5px;font-weight:700}
.lb .l{direction:ltr;display:inline-block}
.pl{flex:0 0 46px;height:46px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.pl svg{width:22px;height:22px;fill:#fff}
.tx{flex:1;min-width:0}
.de{direction:ltr;text-align:left;font-size:19px;font-weight:700;overflow-wrap:anywhere}
.ar{color:var(--ar);font-size:17px;font-weight:700}
.mn{color:var(--mute);font-size:13px}
.bar{flex-wrap:wrap;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bar);backdrop-filter:blur(10px);border-top:1px solid var(--line);
 padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;align-items:center;justify-content:center}
.seg{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:9px 14px;font:inherit;font-size:14px;font-weight:700}
.seg button.on{background:#3d8bff;color:#fff}
.go{border:0;border-radius:999px;background:#2bb3a3;color:#fff;padding:11px 16px;font:inherit;font-size:14px;font-weight:700}
.stop{border:0;border-radius:999px;background:#ef6f6c;color:#fff;padding:11px 14px;font:inherit;font-size:14px;font-weight:700}
</style>
</head>
<body>
